or n>=1."},"2":{"t":"An Energy Approach to the Solution of Partial Differential Equations in Computational Mechanics via Machine Learning: Concepts, Implementation and Applications","a":"Samaniego et al.","y":2019,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"Deep Energy Method (DEM): replace the residual-MSE loss of PINNs by the total potential energy of the mechanical system, integrated over the domain by numerical quadrature, and enforce Dirichlet BCs exactly by hard-coding them into the network output."},"3":{"t":"Deep Nitsche Method: Deep Ritz Method with Essential Boundary Conditions","a":"Liao and Ming","y":2019,"v":"Communications in Computational Physics","g":"","s":"Augment the Deep Ritz energy functional with Nitsche's surface terms so that essential (Dirichlet) boundary conditions are imposed weakly but consistently (no soft-penalty bias)."},"4":{"t":"Learning in Modal Space: Solving Time-Dependent Stochastic PDEs Using Physics-Informed Neural Networks","a":"Zhang et al.","y":2019,"v":"SIAM Journal on Scientific Computing","g":"","s":"Couple PINNs with the dynamically-orthogonal (DO) and bi-orthogonal (BO) modal decompositions to solve nonlinear time-dependent stochastic PDEs."},"5":{"t":"Modeling the Dynamics of PDE Systems with Physics-Constrained Deep Auto-Regressive Networks","a":"Geneva and Zabaras","y":2019,"v":"Journal of Computational Physics","g":"https://github.com/cics-nd/ar-pde-cnn","s":"Replace the MLP+autograd PINN by a convolutional encoder-decoder (AR-DenseED) trained to act as a one-step time-integrator on a uniform grid."},"6":{"t":"PPINN: Parareal Physics-Informed Neural Network for time-dependent PDEs","a":"Meng et al.","y":2019,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"Apply the classical Parareal parallel-in-time algorithm to PINNs: a serial coarse-grained (CG) solver propagates a simplified PDE through the full long-time interval; many fine PINNs (one per time-subdomain) run in parallel and correct the CG…"},"7":{"t":"Physics Informed Extreme Learning Machine (PIELM) - A rapid method for the numerical solution of partial differential equations","a":"Dwivedi and Srinivasan","y":2019,"v":"Neurocomputing","g":"","s":"Replace the deep PINN by a single-hidden-layer network with random fixed input weights and biases (an Extreme Learning Machine)."},"8":{"t":"Physics-informed neural networks: A deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations","a":"Raissi et al.","y":2019,"v":"Journal of Computational Physics","g":"","s":"The foundational PINN paper."},"9":{"t":"Transfer learning enhanced physics informed neural network for phase-field modeling of fracture","a":"Goswami et al.","y":2019,"v":"Theoretical and Applied Fracture Mechanics","g":"","s":"A Deep-Energy-Method PINN for phase-field brittle fracture: minimise the variational energy (elastic + fracture surface energy) rather than the residual; enforce Dirichlet BCs exactly via output reshaping; integrate with NURBS-element Gauss-Legendre…"},"10":{"t":"Variational Physics-Informed Neural Networks For Solving Partial Differential Equations","a":"Kharazmi et al.","y":2019,"v":"arXiv:1912.00873","g":"","s":"A Petrov-Galerkin PINN: the trial function is a deep neural net, but the test functions are a fixed linear basis (Legendre polynomials, sines, or compactly-supported polynomials on subdomains)."},"11":{"t":"Weak Adversarial Networks for High-dimensional Partial Differential Equations","a":"Zang et al.","y":2019,"v":"Journal of Computational Physics","g":"","s":"Cast the weak form of a PDE as a min-max (saddle-point) problem: the primal network u_theta solves the PDE in weak sense; the adversarial test-function network phi_eta tries to maximise the operator-norm residual |<A[u_theta], phi_eta>| / ||phi_eta||."},"12":{"t":"A Method for Representing Periodic Functions and Enforcing Exactly Periodic Boundary Conditions with Deep NN (\"Deep Collocation Method\", DCM) for 3-D solid mechanics with multiple constitutive laws — linear elasticity, neo-Hookean hyperelasticity at large deformation, and J2 (von Mises) plasticity with isotropic and…"},"18":{"t":"Multi-scale Deep Neural Network (MscaleDNN) for Solving Poisson-Boltzmann Equation in Complex Domains","a":"Liu et al.","y":2020,"v":"Communications in Computational Physics","g":"","s":"Counter the F-Principle (spectral bias: PINNs learn low frequencies first) by splitting the first hidden layer into N groups, each of which sees the input pre-multiplied by a different scale factor a_i (e.g."},"19":{"t":"NSFnets (Navier-Stokes flow nets): Physics-informed neural networks for the incompressible Navier-Stokes equations","a":"Jin et al.","y":2020,"v":"Journal of Computational Physics","g":"","s":"NSFnets are PINNs that solve incompressible Navier-Stokes either in velocity-pressure (VP) or vorticity-velocity (VV) form, with no Poisson splitting and no pressure data."},"20":{"t":"On the eigenvector bias of Fourier feature networks: From regression to solving multi-scale PDEs with physics-informed neural networks","a":"Wang et al.","y":2020,"v":"CMAME","g":"https://github.com/PredictiveIntelligenceLab/MultiscalePINNs","s":"Vanilla PINNs are biased toward learning low-frequency components of the solution because the dominant NTK eigenvectors are low-frequency."},"21":{"t":"Optimally weighted loss functions for solving PDEs with Neural Networks","a":"Meer et al.","y":2020,"v":"J. Comp. Appl. Math.","g":"https://github.com/remcovandermeer/Optimally-Weighted-PINNs","s":"Derives a closed-form optimal loss weight lambda between residual and BC terms by minimizing an epsilon-closeness bound for linear well-posed PDEs, then turns it into a self-supervised heuristic (\"Magnitude Normalization\") that needs no access to the true…"},"22":{"t":"PFNN: A Penalty-Free Neural Network Method for Solving a Class of Second-Order Boundary-Value Problems on Complex Geometries","a":"Sheng and Yang","y":2020,"v":"Journal of Computational Physics","g":"","s":"Solve second-order BVPs with the deep Ritz energy form and a TWO-network ansatz: one network g learns the Dirichlet boundary, another f handles the interior, glued by a hand-built length factor ell(x) so the trial solution exactly satisfies essential BCs…"},"23":{"t":"Self-Adaptive Physics-Informed Neural Networks using a Soft Attention Mechanism","a":"McClenny and Braga-Neto","y":2020,"v":"AAAI Spring Symp. MLPS / J. Comp. Phys.","g":"https://github.com/levimcclenny/SA-PINNs","s":"Give every collocation, BC and IC point its OWN trainable weight lambda_i."},"24":{"t":"Solving Allen-Cahn and Cahn-Hilliard Equations using the Adaptive Physics Informed Neural Networks","a":"Wight and Zhao","y":2020,"v":"Communications in Computational Physics","g":"","s":"For phase-field PDEs with sharp moving interfaces (Allen-Cahn, Cahn-Hilliard), vanilla PINN fails."},"25":{"t":"The Neural Particle Method - An Updated Lagrangian Physics Informed Neural Network for Computational Fluid Dynamics","a":"Wessels et al.","y":2020,"v":"CMAME","g":"https://gitlab.com/henningwessels/npm","s":"NPM is a Lagrangian-particle PINN for incompressible inviscid Euler with free surfaces."},"26":{"t":"When and why PINNs fail to train: A neural tangent kernel perspective","a":"Wang et al.","y":2020,"v":"J. Comp. Phys.","g":"https://github.com/PredictiveIntelligenceLab/PINNsNTK","s":"Derive the limiting NTK of PINNs and show K = block-diag(K_uu, K_rr): the residual block K_rr typically has eigenvalues 10^2-10^3 larger than the BC/IC block K_uu, so the residual term converges fast and the BC term converges slowly — the cause of training…"},"27":{"t":"hp-VPINNs: Variational Physics-Informed Neural Networks With Domain Decomposition","a":"Kharazmi et al.","y":2020,"v":"CMAME","g":"","s":"A single global DNN is the trial space, but the residual is projected onto LOCAL piecewise polynomial test functions on a non-overlapping element partition (sub-domain Petrov-Galerkin)."},"28":{"t":"A High-Efficient Hybrid Physics-Informed Neural Networks Based on Convolutional Neural Network","a":"Fang","y":2021,"v":"IEEE Transactions on Neural Networks and Learning Systems","g":"","s":"Replace autodiff in PINN by a mesh-free finite-volume-style local-fitting stencil: for every point P_0 build a sparse linear combination w_i such that sum_i w_i u(P_i) approximates the differential operator exactly on a basis of polynomials."},"29":{"t":"A Physics Informed Neural Network for Time-Dependent Nonlinear and Higher Order Partial Differential Equations","a":"Mattey and Ghosh","y":2021,"v":"CMAME","g":"","s":"bc-PINN: train a SINGLE network sequentially over short time segments."},"30":{"t":"A novel meta-learning initialization method for physics-informed neural networks","a":"Liu et al.","y":2021,"v":"Neural Computing and Applications","g":"","s":"NRPINN: Apply the Reptile meta-learning algorithm to a family of parameterized PDEs (e.g."},"31":{"t":"A two-stage physics-informed neural network method based on conserved quantities and applications in localized wave solutions","a":"Lin and Chen","y":2021,"v":"J. Comp. Phys.","g":"","s":"For integrable PDEs (Boussinesq-Burgers, Sawada-Kotera, classical Boussinesq-Burgers), augment standard PINN with a second training stage that adds a GLOBAL loss term penalizing departure from a known conserved quantity m(t) = integral of M[u]dx."},"32":{"t":"CAN-PINN: A Fast Physics-Informed Neural Network Based on Coupled-Automatic-Numerical Differentiation Method","a":"Chiu et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"PINN's pure-AD residual can be fit pointwise without actually solving the PDE (under-constrained in sparse-collocation regime)."},"33":{"t":"Characterizing possible failure modes in physics-informed neural networks","a":"Krishnapriyan et al.","y":2021,"v":"NeurIPS 2021","g":"https://github.com/a1k12/characterizing-pinns-failure-modes","s":"Vanilla PINN fails on even simple convection (beta>~10), reaction (rho>~5) and reaction-diffusion PDEs not because of network capacity but because the PDE-residual soft-constraint creates an ill-conditioned loss landscape."},"34":{"t":"DAS-PINNs: A deep adaptive sampling method for solving high-dimensional partial differential equations","a":"Tang et al.","y":2021,"v":"J. Comp. Phys.","g":"","s":"DAS-PINN: train a deep generative model (KRnet, a normalizing flow with triangular Knothe-Rosenblatt structure) to fit the residual^2 of the current PINN as a probability density."},"35":{"t":"Efficient training of physics-informed neural networks via importance sampling","a":"Nabian et al.","y":2021,"v":"Computer-Aided Civil and Infrastructure Engineering","g":"","s":"Sample collocation points each iteration proportionally to the per-point PINN loss (importance sampling), with the Horvitz-Thompson 1/q correction to keep the gradient unbiased."},"36":{"t":"Exact imposition of boundary conditions with distance functions in physics-informed deep neural networks","a":"Sukumar and Srivastava","y":2021,"v":"CMAME","g":"","s":"Build an analytic Approximate Distance Function (ADF) phi(x) to the boundary using R-functions (constructive solid geometry) or mean value coordinates, then write the trial as u_theta(x) = g(x) + phi(x) u_hat_theta(x)."},"37":{"t":"Extreme theory of functional connections: A fast physics-informed neural network method for solving ordinary and partial differential equations","a":"Schiassi et al.","y":2021,"v":"Neurocomputing 457","g":"","s":"X-TFC fuses the Theory of Functional Connections (TFC) — a constrained-expression that analytically enforces IC/BC — with a single-hidden-layer Extreme Learning Machine (ELM) as the free function."},"38":{"t":"Finite basis physics-informed neural networks (FBPINNs): a scalable domain decomposition approach for solving differential equations","a":"Moseley et al.","y":2021,"v":"Advances in Computational Mathematics 49:62 (2023)","g":"https://github.com/benmoseley/FBPINNs","s":"FBPINNs partition the domain into overlapping subdomains, place a small MLP in each, and form the global solution as a sum of subdomain networks each multiplied by a smooth compactly-supported window — like a learned FEM basis."},"39":{"t":"Gradient-enhanced physics-informed neural networks for forward and inverse PDE problems","a":"Yu et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"Since a PDE residual f(x)=0 everywhere implies ∇f(x)=0 everywhere, gPINN augments the standard PINN loss with the squared norm of the residual's spatial gradient."},"40":{"t":"Learning in Sinusoidal Spaces With Physics-Informed Neural Networks","a":"Wong et al.","y":2021,"v":"IEEE Transactions on Artificial Intelligence","g":"","s":"A standard Xavier-initialised tanh PINN has near-zero input gradients at initialisation, so it trivially satisfies the PDE residual but is far from any BC-compatible solution — a deceptive local minimum SGD cannot escape."},"41":{"t":"Meta-learning PINN loss functions","a":"Psaros et al.","y":2021,"v":"Journal of Computational Physics","g":"","s":"A bi-level meta-learning scheme discovers a parametric PINN loss ℓ_η offline by differentiating the inner PINN-training trajectory and optimising the outer MSE on a family of parametric PDE tasks."},"42":{"t":"Multi-Objective Loss Balancing for Physics-Informed Deep Learning","a":"Bischof and Kraus","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"https://github.com/rbischof/relative_balancing","s":"The paper benchmarks three existing PINN loss-balancing schemes (Learning-Rate Annealing, GradNorm, SoftAdapt) and proposes ReLoBRaLo (Relative Loss Balancing with Random Lookback), a cheap loss-only scheme that combines softmax normalisation, relative…"},"43":{"t":"PhyCRNet: Physics-informed Convolutional-Recurrent Network for Solving Spatiotemporal PDEs","a":"Ren et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"https://github.com/isds-neu/PhyCRNet","s":"Instead of representing u(x,t) with a fully-connected MLP, PhyCRNet uses an encoder–ConvLSTM–decoder over the discretised spatial grid and steps it autoregressively in time with a forward-Euler residual connection."},"44":{"t":"Physics-informed graph neural Galerkin networks: A unified framework for solving PDE-governed forward and inverse problems","a":"Gao et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"PI-GGN replaces the MLP of a continuous PINN with a Chebyshev graph-convolutional network that outputs nodal values on an unstructured FE mesh."},"45":{"t":"Physics-informed neural network simulation of multiphase poroelasticity using stress-split sequential training","a":"Haghighat et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"For coupled flow-mechanics in porous media, jointly training a PINN on all balance equations is unstable."},"46":{"t":"Quadratic Residual Networks: A New Class of Neural Networks for Solving Forward and Inverse Problems in Physics Involving PDEs","a":"Bu and Karpatne","y":2021,"v":"SIAM SDM 2021","g":"https://github.com/jayroxis/qres","s":"QRes adds a Hadamard-product \"quadratic residual\" term to every layer: y = σ(W₂x ⊙ W₁x + W₁x + b)."},"47":{"t":"Residual-based adaptivity for two-phase flow simulation in porous media using Physics-informed Neural Networks","a":"Hanna et al.","y":2021,"v":"Computer Methods in Applied Mechanics and Engineering","g":"","s":"Standard RAR (residual-based adaptive refinement) over-clusters collocation points at sharp moving fronts."},"48":{"t":"SPINN: Sparse, Physics-based, and partially Interpretable Neural Networks for PDEs","a":"Ramabathiran and Ramachandran","y":2021,"v":"Journal of Computational Physics","g":"https://github.com/nn4pde/SPINN","s":"SPINN rewrites a radial-basis-function meshless ansatz u(x) = d neural network technique based on a modified loss function for computational 2D and 3D solid mechanics","a":"Bai et al.","y":2022,"v":"Computational Mechanics 71:543-562 (2023)","g":"https://github.com/JinshuaiBai/LSWR_loss_function_PINN","s":"Replace the pointwise MSE PDE loss with an integrated Least-Squares Weighted Residual (LSWR) loss ∫_Ω R_g² dΩ + ∫_Γt R_t² dΓ, scaled by χ_1 = h/E² and χ_2 = 1/E² to be dimensionless."},"54":{"t":"Augmented Physics-Informed Neural Networks (APINNs): A gating network-based soft domain decomposition methodology","a":"Hu et al.","y":2022,"v":"Engineering Applications of Artificial Intelligence","g":"","s":"APINN replaces XPINN's hard space-time decomposition + interface losses with a trainable gating network G(x): Ω → Δ_m that softly weights m sub-networks E_i(h(x)) sharing a common trunk h."},"55":{"t":"Discontinuity Computing Using Physics-Informed Neural Networks","a":"Liu et al.","y":2022,"v":"Journal of Scientific Computing","g":"","s":"Plain PINNs stall on conservation laws with shocks because residual points falling inside the shock carry infinite-gradient loss they cannot reduce."},"56":{"t":"Enhanced physics-informed neural networks with Augmented Lagrangian relaxation method (AL-PINNs)","a":"Son et al.","y":2022,"v":"Neurocomputing","g":"https://github.com/HwijaeSon/AL-PINNs","s":"Treat boundary/initial conditions as hard constraints and the PDE residual as the objective; relax the constraints with an Augmented Lagrangian that adds both a quadratic penalty beta and a learnable, point-wise multiplier lambda(x_b)."},"57":{"t":"Failure-informed adaptive sampling for PINNs","a":"Gao et al.","y":2022,"v":"SIAM J. Sci. Comput.","g":"","s":"Treat residual-exceedance as a \"failure event\" from reliability analysis."},"58":{"t":"Physics-informed attention-based neural network for hyperbolic partial differential equations: application to the Buckley-Leverett problem","a":"Rodriguez-Torrado et al.","y":2022,"v":"Scientific Repor Gradient-PINNs-ICML23","s":"Standard PINN optimizers (GD, Adam, BFGS) plateau around relative L2 ~ 1e-3 because the squared-residual loss is ill-conditioned in parameter space."},"64":{"t":"MultiAdam: Parameter-wise Scale-invariant Optimizer for Multiscale Training of PINNs","a":"Yao et al.","y":2023,"v":"ICML 2023","g":"https://github.com/i207M/MultiAdam","s":"For a k-th-order PDE, shrinking the domain by t multiplies the PDE loss by t^{2k} while the boundary loss stays put — vanilla Adam silently lets the dominant term win."},"65":{"t":"Multilevel domain decomposition-based architectures for physics-informed neural networks","a":"Dolean et al.","y":2023,"v":"Computer Methods in Applied Mechanics and Engineering (CMAME)","g":"https://github.com/benmoseley/FBPINNs/tree/multilevel-paper","s":"Multilevel FBPINNs stack several overlapping domain decompositions at increasing resolutions; each subdomain hosts a small MLP that is restricted by a smooth window function (partition of unity), and the global solution is the sum across all subdomains…"},"66":{"t":"NAS-PINN: Neural architecture search-guided physics-informed neural network for solving PDEs","a":"Wang and Zhong","y":2023,"v":"Journal of Computational Physics","g":"","s":"Use DARTS-style differentiable NAS to automatically choose the depth and per-layer width of an MLP for a given PDE."},"67":{"t":"PINNsFormer: A Transformer-Based Framework for Physics-Informed Neural Networks","a":"Zhao et al.","y":2023,"v":"ICLR 2024","g":"https://github.com/AdityaLab/pinnsformer","s":"Turn each (x, t) collocation point into a pseudo-sequence {(x, t), (x, t+dt), ..., (x, t+(k-1)dt)} and feed it through an encoder-decoder Transformer with a new Wavelet activation w1 sin(x) + w2 cos(x)."},"68":{"t":"Physics-Informed Kernel Function Neural Networks for Solving Partial Differential Equations","a":"Fu et al.","y":2023,"v":"Neural Networks","g":"","s":"PIKFNN replaces the RBF activations of an RBF network with physics-informed kernel e PDE system itself, not the neural network Hessian."},"74":{"t":"Challenges in Training PINNs: A Loss Landscape Perspective","a":"Rathore et al.","y":2024,"v":"ICML 2024","g":"https://github.com/pratikrathore8/opt_for_pinns","s":"The PINN loss Hessian is ill-conditioned (top eigenvalue 1e4-1e5) because of the differential operator in the residual term."},"75":{"t":"Energy-based physics-informed neural network for frictionless contact problems under large deformation","a":"Bai et al.","y":2024,"v":"Computer Methods in Applied Mechanics and Engineering","g":"https://github.com/JinshuaiBai/energy_PINN_Contact","s":"The deep energy method (DEM) is extended to frictionless large-deformation contact by adding an exponential Lennard-Jones-like surface-contact potential to the total potential energy."},"76":{"t":"Kolmogorov-Arnold-Informed neural network (KINN): A physics-informed deep learning framework for solving forward and inverse problems based on Kolmogorov-Arnold Networks","a":"Wang et al.","y":2024,"v":"Computer Methods in Applied Mechanics and Engineering","g":"https://github.com/yizheng-wang/Research-on-Solving-Partial-Differential-Equations-of-Solid-Mechanics-Based-on-PINN","s":"KINN replaces the MLP backbone in three PDE formulations - strong-form (PINN), energy-form (DEM) and inverse boundary-integral form (BINN) - with a B-spline Kolmogorov-Arnold Network (KAN)."},"77":{"t":"Loss-attentional physics-informed neural networks","a":"Song et al.","y":2024,"v":"Journal of Computational Physics 501 (2024) 112781","g":"","s":"LA-PINN attaches one loss-attentional network (LAN) - a linear sub-net without activations - to each loss component (residual / IC / BC)."},"78":{"t":"Multi-level physics-informed deep learning for solving partial differential equations in computational structural mechanics","a":"He et al.","y":2024,"v":"Communications Engineering 3 (2024)","g":"https://github.com/he-weiwei/ml-PINN","s":"For bending of beams and shells (governed by 4th-order n
