site_name: PINNSeek
site_description: Knowledge-centric agent system for autonomous discovery of physics-informed neural network solvers
site_url: https://colalab.ai/pinnseek/
docs_dir: content
site_dir: .build/site
use_directory_urls: false
dev_addr: 127.0.0.1:8820
theme:
  name: material
  custom_dir: overrides
  favicon: assets/img/pinnseek-icon.svg
  logo: assets/img/pinnseek-logo.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
extra_css:
  - assets/css/theme.css
extra:
  # the trial application: a Google Form without sign-in or uploads (step 1; the data follow through a link sent to
  # accepted applicants); created by website/tools/trial_form.gs, its link opens from the header and the home page
  apply_url: https://docs.google.com/forms/d/e/1FAIpQLScytQKrKLZ1v94h-mEccmfmPIT5UEEEh8Y45yRK3dec2pmMEg/viewform
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
# the top bar lists the sections of the home page by their overlines (author, 2026-11-02); the site name goes home,
# and the benchmark pages open from the Results section (its gallery and "Explore the benchmark"). The section links
# are anchors on index.html, which MkDocs cannot check, so a nav link it does not find is reported as info, and so
# are the pages outside the nav
validation:
  nav:
    not_found: info
    omitted_files: info
nav:
  - How it works: index.html#knowledge-and-agency
  - Results: index.html#benchmark
  - Deep dive: index.html#results
